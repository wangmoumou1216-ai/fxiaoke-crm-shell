      function renderEmptyView(menuName) {
        return [
          '<div class="workbench-root" data-view="empty" data-od-id="empty-workbench">',
            workbenchHeader("empty", "CRM 工作区", menuName, "该菜单保留原有入口，目前尚未接入销售人员工作台内容。"),
            '<section class="wb-card wb-empty" data-od-id="empty-workbench-state"><div><h2>当前菜单暂无演示内容</h2><p>你可以返回首页，继续体验客户、商机、经营分析与任务之间的联动。</p><div class="wb-inline-actions" style="justify-content:center;margin-top:18px"><button class="wb-btn wb-btn-primary" type="button" data-route="home">返回销售工作台</button></div></div></section>',
          '</div>'
        ].join("");
      }

      const ICT_AI_META = {
        sales: {
          title: "销售助手 · 今日执行与业务闭环",
          context: "销售业务工作台 · 今日优先事项、重点客户、商机与日程",
          prompts: ["解释今日优先级", "生成今日行动计划", "准备客户拜访"]
        },
        manager: {
          title: "经营助手 · 异常判断与管理决策",
          context: "销售管理工作台 · 经营指标、人员与部门、管理待办、重大事项与资源决策",
          prompts: ["解释经营异常", "生成周例会简报", "识别待决策事项"]
        },
        customer: {
          title: "客户经营助手 · 客户组合与关系布局",
          context: "客户经营工作台 · 客户分层、关系、经营计划与机会信号",
          prompts: ["分析关系缺口", "生成经营行动", "识别空白机会"]
        },
        opportunity: {
          title: "商机作战助手 · 赢单与风险推进",
          context: "商机管理工作台 · 分层节奏、决策链、竞争、资源和风险",
          prompts: ["分析商机健康", "生成下一步行动", "检查投标约束"]
        },
        tender: {
          title: "市场洞察助手 · 信号转化与规则优化",
          context: "标讯与市场洞察 · 趋势、标讯运营、内部扩散与采集规则",
          prompts: ["解释市场趋势", "创建区域验证", "分析采集规则"]
        },
        detail: {
          title: "对象助手 · 当前对象深度分析",
          context: "对象详情 · 字段、流程、动态、任务与关联对象",
          prompts: ["总结当前对象", "识别风险与机会", "生成下一步动作"]
        }
      };

      function ictRoleLabel() {
        return state.workbench.role === "manager" ? "销售管理" : "销售业务";
      }

      function getICTPageId(tabId) {
        return tabId === "home" ? state.workbench.role : tabId;
      }

      function syncICTRoleUI() {
        if (!ictPageHost) return;
        if (ictRoleSelect) ictRoleSelect.value = state.workbench.role;
        ictPageHost.querySelectorAll("[data-current-role]").forEach((element) => {
          element.textContent = ictRoleLabel();
        });
      }

      function renderICTTabs() {
        if (!ictTabs) return;
        ictTabs.innerHTML = state.workbench.openTabs.map((tabId) => {
          const active = tabId === state.workbench.activeTab;
          const label = tabId === "detail" && currentICTObject ? currentICTObject.name : ICT_TAB_LABELS[tabId];
          const close = tabId === "home" ? "" : '<button class="ict-tab-close" type="button" data-ict-close="' + tabId + '" aria-label="关闭' + escapeHtml(label) + '页签" data-od-id="ict-close-' + tabId + '">×</button>';
          return '<div class="ict-tab-item' + (active ? ' active' : '') + '" data-od-id="ict-tab-item-' + tabId + '"><button class="ict-tab' + (active ? ' active' : '') + '" type="button" role="tab" aria-selected="' + String(active) + '" data-ict-tab="' + tabId + '" data-od-id="ict-tab-' + tabId + '"><span class="ict-tab-label">' + escapeHtml(label) + '</span></button>' + close + '</div>';
        }).join("");
      }

      function buildICTPageContext(pageId, prompt) {
        const page = ictPageHost && ictPageHost.querySelector("#" + pageId);
        const meta = ICT_AI_META[pageId] || ICT_AI_META.sales;
        const metricItems = page ? Array.from(page.querySelectorAll(".metric")).slice(0, 4).map((metric) => ({
          label: (metric.querySelector(".label") || {}).textContent || "指标",
          text: [metric.querySelector(".value"), metric.querySelector(".trend")].filter(Boolean).map((element) => element.textContent.trim()).join(" · ")
        })) : [];
        const workItems = page ? Array.from(page.querySelectorAll(".work-item")).slice(0, 3).map((item) => ({
          label: (item.querySelector("h4") || {}).textContent || "业务事项",
          text: (item.querySelector("p") || {}).textContent || "请核验当前业务事实后推进。"
        })) : [];
        const firstRows = page ? Array.from(page.querySelectorAll("table tbody tr")).slice(0, 3).map((row, index) => ({
          label: "对象 " + (index + 1),
          text: Array.from(row.children).slice(0, 4).map((cell) => cell.textContent.replace("【AI】", "").trim()).filter(Boolean).join(" · ")
        })) : [];
        const evidence = metricItems.length ? metricItems : firstRows;
        const priorities = workItems.length ? workItems : firstRows;
        return {
          prompt: prompt || "请结合当前" + (page && page.dataset.pageTitle || "业务工作台") + "内容，解释重点并给出下一步。",
          intro: meta.context + "。以下判断只引用当前页面已显示的数据，并按“事实、风险、动作”组织。",
          sections: [
            { title: "当前事实", items: evidence.length ? evidence : [{ label: "页面", text: page && page.dataset.pageTitle || "角色工作台" }] },
            { title: "建议推进", items: priorities.length ? priorities : [
              { label: "先核验", text: "确认对象、责任人、阶段与时间窗口。" },
              { label: "再执行", text: "将确认后的判断转为任务、计划、协同或 CRM 记录。" }
            ] }
          ],
          actions: [
            { label: "生成推进任务", action: "create-task" },
            { label: "返回角色工作台", route: "home" }
          ]
        };
      }

      function showICTPageContext(pageId, sourceLabel, prompt) {
        WORKBENCH_CONTEXTS["ict-runtime"] = buildICTPageContext(pageId, prompt);
        showAgentContext("ict-runtime", sourceLabel || (ICT_AI_META[pageId] || ICT_AI_META.sales).title);
      }

      function showICTObjectContext(object, prompt) {
        const objectFields = (object.fields || []).slice(0, 6).map((field) => ({ label: field.label, text: field.value }));
        WORKBENCH_CONTEXTS["ict-runtime"] = {
          prompt: prompt || "请分析" + object.type + "：“ + object.name + ”，识别风险、机会与下一步动作。",
          intro: "已接收当前页面中的“" + object.name + "”及该对象可见字段。判断将保留来源角色与来源工作台，不使用参考图中的替代数据。",
          sections: [
            { title: "对象事实", items: objectFields.length ? objectFields : [{ label: "对象", text: object.name }] },
            { title: "下一步", items: [
              { label: "核验", text: "确认关键关系、阶段或状态，以及下一里程碑。" },
              { label: "闭环", text: "为确认后的动作指定 Owner 与截止时间，并回写当前业务对象。" }
            ] }
          ],
          actions: [
            { label: "创建对象任务", action: "create-task" },
            { label: "返回来源工作台", route: ictPreviousTab }
          ]
        };
        showAgentContext("ict-runtime", object.type + " · " + object.name);
      }

      function activateICTPage(tabId, options = {}) {
        if (!ictPageHost) return;
        let selected = ALLOWED_WORKBENCH_VIEWS.includes(tabId) ? tabId : "home";
        if (selected === "detail" && !currentICTObject) selected = ictPreviousTab && ictPreviousTab !== "detail" ? ictPreviousTab : "home";
        if (!state.workbench.openTabs.includes(selected)) state.workbench.openTabs.push(selected);
        if (state.workbench.activeTab !== selected && state.workbench.activeTab !== "detail") ictPreviousTab = state.workbench.activeTab;
        state.workbench.activeTab = selected;
        state.workbench.view = selected;
        state.workbench.previousTab = ictPreviousTab;
        const pageId = getICTPageId(selected);
        ictPageHost.querySelectorAll(".page").forEach((page) => page.classList.toggle("active", page.id === pageId));
        if (selected !== "detail") {
          const sceneMenus = { customer: "客户及商机管理", opportunity: "售前项目管理", tender: "标讯通" };
          if (sceneMenus[selected]) state.activeMenu = sceneMenus[selected];
          else if (Object.values(sceneMenus).includes(state.activeMenu)) state.activeMenu = "首页";
          let menuTarget = getMenuButtons().find((button) => button.dataset.menu === state.activeMenu);
          if (!menuTarget) {
            state.activeMenu = "首页";
            menuTarget = getMenuButtons().find((button) => button.dataset.menu === state.activeMenu);
          }
          getMenuButtons().forEach((button) => button.classList.toggle("active", button === menuTarget));
        }
        renderICTTabs();
        syncICTRoleUI();
        activeTab.textContent = selected === "detail" && currentICTObject ? currentICTObject.name : ICT_TAB_LABELS[selected];
        workspaceCard.setAttribute("aria-label", activeTab.textContent + "动态内容区域");
        if (options.scroll !== false && ictCanvas) ictCanvas.scrollTop = 0;
        if (options.syncAgent !== false && panel.classList.contains("context-mode")) {
          if (selected === "detail" && currentICTObject) showICTObjectContext(currentICTObject);
          else showICTPageContext(pageId, activeTab.textContent);
        }
        if (options.persist !== false) saveState();
      }

      function openICTTab(tabId, options = {}) {
        if (!ALLOWED_WORKBENCH_VIEWS.includes(tabId)) return;
        if (!state.workbench.openTabs.includes(tabId)) state.workbench.openTabs.push(tabId);
        renderICTTabs();
        activateICTPage(tabId, options);
      }

      function closeICTTab(tabId) {
        if (tabId === "home") return;
        const index = state.workbench.openTabs.indexOf(tabId);
        if (index < 0) return;
        state.workbench.openTabs.splice(index, 1);
        if (tabId === "detail") currentICTObject = null;
        if (ictPreviousTab === tabId) ictPreviousTab = state.workbench.openTabs[Math.max(0, index - 1)] || "home";
        if (state.workbench.activeTab === tabId) {
          const fallback = state.workbench.openTabs[Math.max(0, index - 1)] || "home";
          activateICTPage(fallback, { syncAgent: panel.classList.contains("context-mode") });
        } else {
          renderICTTabs();
          saveState();
        }
      }

      function setICTRole(role, announce = true) {
        if (!ALLOWED_WORKBENCH_ROLES.includes(role)) return;
        state.workbench.role = role;
        syncICTRoleUI();
        activateICTPage("home", { syncAgent: panel.classList.contains("context-mode") });
        if (announce) showToast("已切换为" + ictRoleLabel() + "视角");
      }

      function inferICTType(pageId, section) {
        if (pageId === "customer") return "客户";
        if (pageId === "opportunity") return "商机";
        if (pageId === "tender") return section.includes("关键词") ? "市场关键词" : section.includes("规则") || section.includes("复盘") ? "采集规则" : "标讯/市场信号";
        if (pageId === "manager") {
          if (section.includes("人员")) return "销售人员";
          if (section.includes("部门")) return "经营部门";
          if (section.includes("待办")) return "管理待办";
          if (section.includes("决策")) return "经营决策";
          return "经营事项";
        }
        if (pageId === "sales") {
          if (section.includes("客户")) return "客户";
          if (section.includes("商机")) return "商机";
          return "业务事项";
        }
        return "业务对象";
      }

      function captureICTRow(row, pageId) {
        const table = row.closest("table");
        const headers = Array.from(table.querySelectorAll("thead th")).map((cell) => cell.textContent.trim());
        const cells = Array.from(row.children).map((cell) => cell.textContent.replace("【AI】", "").trim());
        const section = (row.closest(".section") && row.closest(".section").querySelector("h2") || {}).textContent || "";
        return {
          type: inferICTType(pageId, section),
          name: cells[0] || section,
          section,
          fields: cells.map((value, index) => ({ label: headers[index] || "字段" + (index + 1), value })).filter((field) => field.value)
        };
      }

      function ictProcessStepsFor(type) {
        if (type === "客户") return ["客户分层", "客户洞察", "经营目标", "关系布局", "机会发现", "行动复盘"];
        if (type === "商机") return ["机会识别", "资格判断", "需求确认", "方案推进", "投标报价", "决策赢单"];
        if (type.includes("标讯") || type.includes("市场") || type.includes("规则")) return ["信号采集", "解析匹配", "业务处置", "机会扩散", "结果跟踪", "规则反哺"];
        if (type === "销售人员") return ["目标诊断", "行为分析", "能力判断", "辅导计划", "行动跟踪"];
        if (type === "经营部门") return ["结果诊断", "原因分析", "资源决策", "负责人行动", "结果跟踪"];
        return ["识别事项", "分析判断", "制定动作", "执行跟踪", "完成复盘"];
      }

      function openICTDetail(object) {
        currentICTObject = object;
        if (state.workbench.activeTab !== "detail") ictPreviousTab = state.workbench.activeTab;
        const sourcePageId = getICTPageId(ictPreviousTab);
        const detailType = ictPageHost.querySelector("#detailType");
        const detailTitle = ictPageHost.querySelector("#detailTitle");
        const detailCrumb = ictPageHost.querySelector("#detailCrumb");
        const detailSubtitle = ictPageHost.querySelector("#detailSubtitle");
        const detailFields = ictPageHost.querySelector("#detailFields");
        const detailSummary = ictPageHost.querySelector("#detailSummary");
        const detailProcessNote = ictPageHost.querySelector("#detailProcessNote");
        const detailProcess = ictPageHost.querySelector("#detailProcess");
        const relatedObjects = ictPageHost.querySelector("#relatedObjects");
        detailType.textContent = object.type + "详情";
        detailTitle.textContent = object.name;
        detailCrumb.textContent = object.section || object.type;
        detailSubtitle.textContent = "来源：" + (ICT_AI_META[sourcePageId] || ICT_AI_META.sales).context + " · 单击列表进入";
        detailFields.innerHTML = (object.fields || []).slice(0, 10).map((field) => '<div class="detail-field"><span>' + escapeHtml(field.label) + '</span><b>' + escapeHtml(field.value) + '</b></div>').join("");
        detailSummary.textContent = object.name + "当前需要结合" + (object.fields || []).slice(1, 4).map((field) => field.label).join("、") + "进一步判断。AI 已准备基于当前角色和来源工作台分析风险、机会与下一步。";
        const steps = ictProcessStepsFor(object.type);
        detailProcessNote.textContent = object.type + "标准作业流程";
        detailProcess.innerHTML = steps.map((step, index) => '<button class="process-step ' + (index < 2 ? 'done' : index === 2 ? 'current' : '') + '" type="button" data-process="' + escapeHtml(step) + '"><span class="process-no">' + (index + 1) + '</span><b>' + escapeHtml(step) + '</b><small>' + (index === 2 ? '当前节点' : '查看节点信息') + '</small></button>').join("");
        relatedObjects.innerHTML = [["关联客户", "华东某城商行"], ["关联商机", "信创升级项目"], ["关联任务", "关键人核验"], ["关联人员", "当前责任人"], ["关联信号", "采购/组织动态"], ["关联文档", "方案与会议纪要"]].map((item) => '<button class="related-card" type="button" data-related="' + escapeHtml(item[1]) + '"><b>' + escapeHtml(item[0]) + '</b><span>' + escapeHtml(item[1]) + '</span></button>').join("");
        ictPageHost.querySelectorAll(".detail-tab").forEach((tab) => tab.classList.toggle("active", tab.dataset.detailTab === "overview"));
        ictPageHost.querySelectorAll(".detail-panel").forEach((panelElement) => panelElement.classList.toggle("active", panelElement.id === "detail-overview"));
        openICTTab("detail", { syncAgent: false });
        showICTObjectContext(object);
      }

      function enhanceICTLists() {
        if (!ictPageHost) return;
        ictPageHost.querySelectorAll(".page:not(#detail) table tbody tr").forEach((row) => {
          if (row.dataset.enhanced) return;
          row.dataset.enhanced = "true";
          row.classList.add("object-row");
          row.tabIndex = 0;
          row.setAttribute("role", "button");
          const object = captureICTRow(row, row.closest(".page").id);
          row._ictObject = object;
          const lastCell = row.lastElementChild;
          if (lastCell) {
            const aiButton = document.createElement("button");
            aiButton.className = "ai-row-btn";
            aiButton.type = "button";
            aiButton.dataset.ictAiRow = "true";
            aiButton.textContent = "【AI】";
            aiButton.setAttribute("aria-label", "让 Agent 分析" + object.name);
            lastCell.appendChild(aiButton);
          }
        });
        ictPageHost.querySelectorAll(".work-item").forEach((item) => {
          if (item.dataset.enhanced) return;
          item.dataset.enhanced = "true";
          item.tabIndex = 0;
          item.setAttribute("role", "button");
          const name = (item.querySelector("h4") || {}).textContent || "业务事项";
          const summary = (item.querySelector("p") || {}).textContent || "";
          const type = name.includes("客户") ? "客户" : name.includes("项目") ? "商机" : "业务事项";
          item._ictObject = { type, name, section: "需要立即处理", fields: [{ label: "事项", value: name }, { label: "关键信息", value: summary }] };
          const meta = item.querySelector(".work-meta");
          if (meta) {
            const aiButton = document.createElement("button");
            aiButton.className = "ai-row-btn";
            aiButton.type = "button";
            aiButton.dataset.ictAiRow = "true";
            aiButton.textContent = "【AI】";
            aiButton.setAttribute("aria-label", "让 Agent 分析" + name);
            meta.appendChild(aiButton);
          }
        });
      }

      function openICTBusinessAction(label, source) {
        const actionId = createId("ict-action");
        WORKBENCH_ACTIONS[actionId] = {
          title: label,
          copy: "将当前页面中的可见事实整理成一份可继续编辑的业务动作草稿。",
          context: "来源：" + (source || activeTab.textContent) + " · 当前角色：" + ictRoleLabel(),
          confirm: "生成草稿"
        };
        openWorkbenchAction(actionId);
      }

      function openICTScene(scene, sourceLabel, revealAgent = true) {
        if (!["customer", "opportunity", "tender"].includes(scene)) return;
        openICTTab(scene, { syncAgent: false });
        if (revealAgent) showICTPageContext(scene, sourceLabel || ICT_TAB_LABELS[scene]);
        showToast("已在动态页签打开" + ICT_TAB_LABELS[scene]);
      }

      function handleICTProcessStep(step) {
        step.parentElement.querySelectorAll(".process-step").forEach((item) => item.classList.remove("current"));
        step.classList.add("current");
        const name = step.dataset.process;
        const pageId = getICTPageId(state.workbench.activeTab);
        if (pageId === "sales") {
          if (name === "客户/商机判断") return openICTScene("customer", name);
          if (name === "执行跟进") return openICTScene("opportunity", name);
          if (name === "识别优先事项") return showICTPageContext("sales", name, "请解释销售业务工作台当前优先事项");
          if (name === "记录复盘") return openICTBusinessAction("记录复盘并回写 CRM", name);
        }
        if (pageId === "manager") {
          if (name === "发现异常" || name === "分析原因") return openICTScene("opportunity", name);
          if (name === "经营决策") return openICTBusinessAction("创建经营决策", name);
          if (name === "下达动作") return openICTBusinessAction("下达管理动作", name);
          if (name === "跟踪结果") return openICTBusinessAction("跟踪负责人执行结果", name);
        }
        openICTBusinessAction("进入流程节点：" + name, currentICTObject ? currentICTObject.name : activeTab.textContent);
      }

      function handleICTFlowNode(node) {
        const map = node.closest(".workflow-map");
        if (map) map.querySelectorAll(".flow-node").forEach((item) => item.classList.toggle("active", item === node));
        const mode = node.dataset.flowMode;
        if (mode === "scene") return openICTScene(node.dataset.flowTarget, node.querySelector("b") && node.querySelector("b").textContent);
        if (mode === "action") {
          const action = node.dataset.flowAction || (node.querySelector("b") || {}).textContent || "执行业务作业";
          if (((node.querySelector(".node-mode") || {}).textContent || "").includes("AI")) return showICTPageContext(getICTPageId(state.workbench.activeTab), action, action);
          return openICTBusinessAction(action, activeTab.textContent);
        }
        if (mode === "object") {
          const type = node.dataset.flowType || "业务对象";
          const name = node.dataset.flowName || (node.querySelector("b") || {}).textContent || "流程对象";
          return openICTDetail({
            type,
            name,
            section: "工作流程图",
            fields: [
              { label: "对象名称", value: name },
              { label: "对象类型", value: type },
              { label: "来源节点", value: (node.querySelector("b") || {}).textContent || name },
              { label: "当前角色", value: ictRoleLabel() },
              { label: "来源工作台", value: (ICT_AI_META[getICTPageId(state.workbench.activeTab)] || ICT_AI_META.sales).context }
            ]
          });
        }
      }

      function handleICTWorkbenchClick(event) {
        const closeTab = event.target.closest("[data-ict-close]");
        if (closeTab) return closeICTTab(closeTab.dataset.ictClose);
        const tab = event.target.closest("[data-ict-tab]");
        if (tab) return activateICTPage(tab.dataset.ictTab);
        if (event.target.closest("#backToList")) return activateICTPage(ictPreviousTab || "home");
        if (event.target.closest("#detailAI") || event.target.closest("#detailSummaryAI")) {
          if (currentICTObject) showICTObjectContext(currentICTObject);
          return;
        }
        const aiRow = event.target.closest("[data-ict-ai-row]");
        if (aiRow) {
          const owner = aiRow.closest(".object-row, .work-item");
          if (owner && owner._ictObject) showICTObjectContext(owner._ictObject);
          return;
        }
        const ask = event.target.closest("[data-ask]");
        if (ask) return showICTPageContext(getICTPageId(state.workbench.activeTab), ask.textContent.trim(), ask.dataset.ask);
        const flowNode = event.target.closest(".flow-node[data-flow-mode]");
        if (flowNode) return handleICTFlowNode(flowNode);
        const detailTab = event.target.closest("[data-detail-tab]");
        if (detailTab) {
          ictPageHost.querySelectorAll(".detail-tab").forEach((item) => item.classList.toggle("active", item === detailTab));
          ictPageHost.querySelectorAll(".detail-panel").forEach((item) => item.classList.toggle("active", item.id === "detail-" + detailTab.dataset.detailTab));
          return;
        }
        const related = event.target.closest("[data-related]");
        if (related) return openICTDetail({ type: "关联对象", name: related.dataset.related, section: "关联对象", fields: [{ label: "名称", value: related.dataset.related }] });
        const processStep = event.target.closest("[data-process]");
        if (processStep) return handleICTProcessStep(processStep);
        const action = event.target.closest("[data-action]");
        if (action) return openICTBusinessAction(action.dataset.action, action.closest(".section, .card, .page") && ((action.closest(".section, .card, .page").querySelector("h2, h3, h1") || {}).textContent) || activeTab.textContent);
        const backRole = event.target.closest("[data-back-role]");
        if (backRole) {
          activateICTPage("home");
          showToast("已返回" + ictRoleLabel() + "工作台");
          return;
        }
        const scene = event.target.closest("[data-scene]");
        if (scene) return openICTScene(scene.dataset.scene, (scene.querySelector("h4") || {}).textContent);
        const jump = event.target.closest(".jump[data-target]");
        if (jump && !jump.classList.contains("work-item")) return openICTScene(jump.dataset.target, jump.textContent.trim());
        const objectOwner = event.target.closest(".object-row, .work-item");
        if (objectOwner && objectOwner._ictObject && !event.target.closest("button")) return openICTDetail(objectOwner._ictObject);
        const filter = event.target.closest(".filter");
        if (filter) {
          filter.parentElement.querySelectorAll(".filter").forEach((item) => item.classList.toggle("active", item === filter));
          showToast("已切换筛选：" + filter.textContent.trim());
        }
      }

      function handleICTWorkbenchChange(event) {
        if (event.target.matches("#ictRoleSelect")) setICTRole(event.target.value);
      }

      function mountICTWorkbench() {
        workspaceCard.classList.add("ict-mounted");
        workspaceCard.innerHTML = [
          '<div class="ict-workbench" data-od-id="ict-workbench">',
            '<header class="ict-framebar" data-od-id="ict-dynamic-framework">',
              '<div class="ict-role-switcher" data-od-id="ict-role-switcher">',
                '<span class="ict-role-mark" aria-hidden="true">角</span>',
                '<div class="ict-role-field"><label for="ictRoleSelect">当前业务角色</label><select class="ict-role-select" id="ictRoleSelect" data-od-id="ict-role-select"><option value="sales">销售业务</option><option value="manager">销售管理</option></select></div>',
              '</div>',
              '<div class="ict-tab-region" data-od-id="ict-tab-region"><div class="ict-tabs" id="ictTabs" role="tablist" aria-label="业务工作区页签"></div></div>',
            '</header>',

        ].join("");

        ictRoleSelect = workspaceCard.querySelector("#ictRoleSelect");

      function renderWorkbench(view) {
        if (!workspaceCard.querySelector(".ict-workbench")) mountICTWorkbench();
        const legacyMap = { customers: "customer", opportunities: "opportunity", analytics: "home", tasks: "home", empty: "home" };
        const selected = legacyMap[view] || view;
        if (ALLOWED_WORKBENCH_VIEWS.includes(selected) && selected !== state.workbench.activeTab) openICTTab(selected, { syncAgent: false });
      }

      function navigateWorkbench(view, persist = true) {
        const legacyMap = { customers: "customer", opportunities: "opportunity", analytics: "home", tasks: "home", empty: "home" };
        const selected = ALLOWED_WORKBENCH_VIEWS.includes(legacyMap[view] || view) ? legacyMap[view] || view : "home";
        if (view === "analytics") state.workbench.role = "manager";
        if (!workspaceCard.querySelector(".ict-workbench")) mountICTWorkbench();
        const menuForView = { home: "首页", customer: "客户及商机管理", opportunity: "售前项目管理", tender: "标讯通" };
        const menuName = menuForView[selected] || "首页";
        const buttons = getMenuButtons();
        const target = buttons.find((button) => button.dataset.menu === menuName);
        buttons.forEach((button) => button.classList.toggle("active", button === target));
        state.activeMenu = menuName;
        syncICTRoleUI();
        openICTTab(selected, { persist, syncAgent: panel.classList.contains("context-mode") });
      }

      function selectMenu(name, persist = true) {
        const buttons = getMenuButtons();
        const target = buttons.find((button) => button.dataset.menu === name) || buttons[0];
        if (!target) return;
        buttons.forEach((button) => button.classList.toggle("active", button === target));
        state.activeMenu = target.dataset.menu;
        let route = "home";
        if (state.activeMenu === "客户及商机管理") route = "customer";
        else if (state.activeMenu === "售前项目管理") route = "opportunity";
        else if (state.activeMenu === "标讯通") route = "tender";
        else if (state.activeMenu === "数据驾驶舱" || state.activeMenu === "数据分析") state.workbench.role = "manager";
        if (!workspaceCard.querySelector(".ict-workbench")) mountICTWorkbench();
        syncICTRoleUI();
        openICTTab(route, { persist: false, syncAgent: panel.classList.contains("context-mode") });
        if (persist) saveState();
      }

      function renderCustomMenuManager() {
        customMenuList.replaceChildren();
        if (!state.customMenus.length) {
          const empty = document.createElement("li");
          empty.className = "custom-menu-empty";
          empty.textContent = "暂无自定义菜单";
          customMenuList.appendChild(empty);
          return;
        }
        state.customMenus.forEach((menu) => {
          const row = document.createElement("li");
          row.className = "custom-menu-row";
          row.appendChild(makeSvg(menu.icon));
          const name = document.createElement("span");
          name.className = "custom-menu-name";
          name.textContent = menu.name;
          row.appendChild(name);
          const remove = document.createElement("button");
          remove.className = "custom-menu-delete";
          remove.type = "button";
          remove.dataset.deleteMenu = menu.id;
          remove.textContent = "删除";
          remove.setAttribute("aria-label", "删除菜单" + menu.name);
          row.appendChild(remove);
          customMenuList.appendChild(row);
        });

      function renderCustomMenus() {
        crmMenuList.querySelectorAll("[data-custom-row]").forEach((row) => row.remove());
        state.customMenus.forEach((menu) => {
          const row = document.createElement("li");
          row.dataset.customRow = menu.id;

          button.className = "crm-menu-item";
          button.type = "button";
          button.dataset.menu = menu.name;
          button.dataset.customId = menu.id;
          button.setAttribute("data-od-id", "crm-custom-" + menu.id);
          button.appendChild(makeSvg(menu.icon, "fx-svg menu-icon custom"));
          const text = document.createElement("span");
          text.className = "menu-text";
          text.textContent = menu.name;
          button.appendChild(text);
          row.appendChild(button);
          crmMenuList.appendChild(row);
        });
        renderCustomMenuManager();
        selectMenu(state.activeMenu, false);
        applyMenuSearch();
      }

      function openMenuConfig() {
        closeDataPopover();
        dialogReturnFocus = document.activeElement;
        menuConfigForm.reset();
        renderCustomMenuManager();
        menuDialog.hidden = false;
        setTimeout(() => menuName.focus(), 0);
      }

      function closeMenuConfig(returnFocus = true) {
        menuDialog.hidden = true;
        if (returnFocus && dialogReturnFocus && typeof dialogReturnFocus.focus === "function") dialogReturnFocus.focus();
      }

      function formatAgentContextTime() {
        return new Intl.DateTimeFormat("zh-CN", {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        }).format(new Date());
      }

      function getAgentContextSourceLabel(trigger) {
        if (!trigger) return "当前业务卡片";
        const directSource = trigger.dataset.contextSource;
        const directLabel = trigger.querySelector(".wb-brief-label, .wb-item-title, .wb-kpi-label, .wb-action-title");
        const container = trigger.closest(".wb-brief, .wb-card, .wb-panel, article, section");
        const contextualLabel = container && container.querySelector(".wb-brief-label, .wb-item-title, .wb-kpi-label, .wb-section-title, h2, h3");
        const source = directSource || (directLabel && directLabel.textContent) || (contextualLabel && contextualLabel.textContent) || trigger.textContent || "当前业务卡片";
        return source.trim().replace(/\s+/g, " ").slice(0, 36) || "当前业务卡片";
      }

      function renderAgentContext(context, sourceLabel) {
        const source = sourceLabel || "当前业务卡片";
        const answerTitle = source.endsWith("分析") ? source : source + "分析";
        const sections = context.sections.map((section, sectionIndex) => [
          '<section class="agent-context-section" data-od-id="agent-context-section-' + sectionIndex + '">',
            '<h2>' + escapeHtml(section.title) + '</h2>',
            '<ul>',
              section.items.map((item) => '<li><strong>' + escapeHtml(item.label) + '：</strong>' + escapeHtml(item.text) + '</li>').join(""),
            '</ul>',
          '</section>'
        ].join("")).join("");
        const actions = (context.actions || []).map((action, index) => {
          const route = action.route ? ' data-context-route="' + escapeHtml(action.route) + '"' : "";
          const workbenchAction = action.action ? ' data-context-action="' + escapeHtml(action.action) + '"' : "";
          return '<button class="agent-context-action" type="button"' + route + workbenchAction + ' data-od-id="agent-context-action-' + index + '"><span>' + escapeHtml(action.label) + '</span><svg class="fx-svg action-arrow" aria-hidden="true"><use href="#fx-arrow-right"></use></svg></button>';
        }).join("");
        const feedbackTools = [
          { id: "regenerate", label: "重新生成", icon: '<path d="M20 11a8 8 0 1 0-2.34 5.66"/><path d="M20 4v7h-7"/>' },
          { id: "copy", label: "复制回答", icon: '<rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>' },
          { id: "helpful", label: "有帮助", toggle: true, icon: '<path d="M7 10v10H4a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2h3Z"/><path d="M7 10l4-7a2 2 0 0 1 2 2v3h5.1a2 2 0 0 1 1.9 2.6l-2.1 7A2 2 0 0 1 16 19H7"/>' },
          { id: "not-helpful", label: "没有帮助", toggle: true, icon: '<path d="M7 14V4H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h3Z"/><path d="M7 14l4 7a2 2 0 0 0 2-2v-3h5.1a2 2 0 0 0 1.9-2.6l-2.1-7A2 2 0 0 0 16 5H7"/>' },
          { id: "more", label: "更多", icon: '<circle cx="5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1" fill="currentColor" stroke="none"/>' }
        ].map((tool) => '<button class="agent-context-feedback-button" type="button" data-context-feedback="' + tool.id + '" data-od-id="agent-context-feedback-' + tool.id + '" aria-label="' + tool.label + '" title="' + tool.label + '"' + (tool.toggle ? ' aria-pressed="false"' : '') + '><svg viewBox="0 0 24 24" aria-hidden="true">' + tool.icon + '</svg></button>').join("");
        return [
          '<div class="agent-context-user" data-od-id="agent-context-user-message">' + escapeHtml(context.prompt) + '</div>',
          '<time class="agent-context-time" data-od-id="agent-context-time">' + formatAgentContextTime() + '</time>',
          '<button class="agent-context-process" type="button" aria-expanded="false" data-context-process-toggle data-od-id="agent-context-process-toggle">',
            '<svg class="fx-svg" aria-hidden="true"><use href="#fx-arrow-right"></use></svg>',
            '<span>已处理当前卡片与关联业务数据</span>',
          '</button>',
          '<div class="agent-context-process-detail" data-context-process-detail hidden>已核对“' + escapeHtml(source) + '”、关联客户或商机，以及页面中显示的截止时间；以下内容仅使用当前原型已有数据。</div>',
          '<hr class="agent-context-rule" />',
          '<article class="agent-context-answer" data-od-id="agent-context-answer">',
            '<h1 class="agent-context-answer-title" data-od-id="agent-context-answer-title">' + escapeHtml(answerTitle) + '</h1>',
            '<div class="agent-context-source" data-od-id="agent-context-source-card">',
              '<span class="agent-context-source-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6.5 3.5h7l4 4v13h-11z"/><path d="M13.5 3.5v4h4M9.5 12h5M9.5 15.5h5"/></svg></span>',
              '<span class="agent-context-source-name">' + escapeHtml(source) + '</span>',
              '<svg class="fx-svg agent-context-source-chevron" aria-hidden="true"><use href="#fx-arrow-right"></use></svg>',
            '</div>',
            '<p>' + escapeHtml(context.intro) + '</p>',
            sections,
            '<div class="agent-context-feedback" role="group" aria-label="回答反馈" data-od-id="agent-context-feedback">' + feedbackTools + '</div>',
            actions ? '<div class="agent-context-actions">' + actions + '</div>' : "",
          '</article>'
        ].join("");
      }

      function showAgentContext(contextId, sourceLabel) {
        const context = WORKBENCH_CONTEXTS[contextId];
        if (!context) return;
        activeAgentContextId = contextId;
        activeAgentContextSource = sourceLabel || activeAgentContextSource || "当前业务卡片";
        state.agent.activeSessionId = null;
        agentContextTitle.hidden = true;
        agentWorkbenchContext.innerHTML = renderAgentContext(context, activeAgentContextSource);
        agentWorkbenchContext.hidden = false;
        agentHero.hidden = true;
        chatLog.replaceChildren();
        panel.classList.add("context-mode");
        agentGuidance.classList.add("context-mode");
        document.querySelectorAll("[data-context-id]").forEach((element) => {
          element.classList.toggle("is-active", element.dataset.contextId === contextId);
        });
        renderSessionList();
        saveState();
        setAgent(true);
        requestAnimationFrame(() => {
          agentGuidance.scrollTop = 0;
        });
      }

      function clearAgentContext() {
        activeAgentContextId = null;
        activeAgentContextSource = "";
        agentContextTitle.hidden = true;
        agentWorkbenchContext.hidden = true;
        agentWorkbenchContext.replaceChildren();
        panel.classList.remove("context-mode");
        agentGuidance.classList.remove("context-mode");
        document.querySelectorAll("[data-context-id]").forEach((element) => element.classList.remove("is-active"));
      }

      function openWorkbenchAction(actionId) {
        const action = WORKBENCH_ACTIONS[actionId];
        if (!action) return;
        pendingWorkbenchAction = actionId;
        dialogReturnFocus = document.activeElement;
        workbenchActionTitle.textContent = action.title;
        workbenchActionCopy.textContent = action.copy;
        workbenchActionContext.textContent = action.context;
        confirmWorkbenchAction.textContent = action.confirm;
        workbenchActionDialog.hidden = false;
        setTimeout(() => confirmWorkbenchAction.focus(), 0);
      }

      function closeWorkbenchAction(returnFocus = true) {
        workbenchActionDialog.hidden = true;
        pendingWorkbenchAction = null;
        if (returnFocus && dialogReturnFocus && typeof dialogReturnFocus.focus === "function") dialogReturnFocus.focus();
      }

      function setAgent(open, returnFocus = false, persist = true) {
        appRoot.classList.toggle("agent-open", open);
        panel.setAttribute("aria-hidden", String(!open));
        panel.inert = !open;
        openAgent.setAttribute("aria-expanded", String(open));
        state.agent.panelOpen = open;
        if (persist) saveState();
        if (open) setTimeout(() => input.focus(), 230);
        if (!open) {
          closeSessionDrawer();
          modelMenu.hidden = true;
          modelSelector.setAttribute("aria-expanded", "false");
          if (returnFocus) openAgent.focus();
        }
      }

      function openSessionDrawer() {
        renderSessionList();
        sessionDrawer.classList.add("open");
        sessionDrawer.setAttribute("aria-hidden", "false");
        agentMenu.setAttribute("aria-expanded", "true");
      }

      function closeSessionDrawer() {
        sessionDrawer.classList.remove("open");
        sessionDrawer.setAttribute("aria-hidden", "true");
        agentMenu.setAttribute("aria-expanded", "false");
      }

      function getActiveSession() {
        return state.agent.sessions.find((session) => session.id === state.agent.activeSessionId) || null;
      }

      function getLatestSession() {
        return state.agent.sessions.slice().sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt))[0] || null;
      }

      function formatSessionTime(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "";
        const today = new Date();
        const sameDay = date.toDateString() === today.toDateString();
        return new Intl.DateTimeFormat("zh-CN", sameDay ? { hour: "2-digit", minute: "2-digit" } : { month: "2-digit", day: "2-digit" }).format(date);
      }

      function renderSessionList() {
        sessionList.replaceChildren();
        const sessions = state.agent.sessions.slice().sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
        if (!sessions.length) {
          const empty = document.createElement("li");
          empty.className = "session-empty";
          empty.textContent = "暂无会话";
          sessionList.appendChild(empty);
        } else {
          sessions.forEach((session) => {
            const row = document.createElement("li");
            row.className = "session-row";
            const choose = document.createElement("button");
            choose.type = "button";
            choose.className = "session-item" + (session.id === state.agent.activeSessionId ? " active" : "");
            choose.dataset.sessionId = session.id;
            choose.setAttribute("data-od-id", "agent-session-" + session.id);
            const title = document.createElement("span");
            title.className = "session-title";
            title.textContent = session.title;
            const time = document.createElement("span");
            time.className = "session-time";
            time.textContent = formatSessionTime(session.updatedAt);
            choose.append(title, time);
            const remove = document.createElement("button");
            remove.type = "button";
            remove.className = "session-delete";
            remove.dataset.deleteSession = session.id;
            remove.setAttribute("aria-label", "删除会话" + session.title);
            remove.appendChild(makeSvg("close"));
            row.append(choose, remove);
            sessionList.appendChild(row);
          });
        }
        continueChat.hidden = !sessions.length;
      }

      function addBubble(message) {
        const bubble = document.createElement("div");
        bubble.className = "chat-bubble " + message.role;
        bubble.textContent = message.text;
        chatLog.appendChild(bubble);
      }

      function renderConversation() {
        chatLog.replaceChildren();
        const session = getActiveSession();
        const hasContext = Boolean(activeAgentContextId && WORKBENCH_CONTEXTS[activeAgentContextId]);
        agentWorkbenchContext.hidden = !hasContext;
        panel.classList.toggle("context-mode", hasContext);
        agentGuidance.classList.toggle("context-mode", hasContext);
        agentHero.hidden = hasContext || Boolean(session);
        if (session) session.messages.forEach(addBubble);
        sendMessage.disabled = !input.value.trim();
        requestAnimationFrame(() => {
          agentGuidance.scrollTop = hasContext && !session ? 0 : agentGuidance.scrollHeight;
        });
      }

      function startNewConversation() {
        clearAgentContext();
        state.agent.activeSessionId = null;
        input.value = "";
        saveState();
        renderConversation();
        renderSessionList();
        closeSessionDrawer();
        input.focus();
      }

      function activateSession(id) {
        if (!state.agent.sessions.some((session) => session.id === id)) return;
        clearAgentContext();
        state.agent.activeSessionId = id;
        saveState();
        renderConversation();
        renderSessionList();
        closeSessionDrawer();
        input.focus();
      }

      function resumeLatestConversation() {
        const session = getActiveSession() || getLatestSession();
        if (!session) {
          showToast("暂无可继续的会话");
          return;
        }
        activateSession(session.id);
      }

      function titleFromMessage(message) {
        return message.length > 18 ? message.slice(0, 18) + "…" : message;
      }

      function sendAgentMessage(text) {
        const message = safeString(text, 4000);
        if (!message) return;
        const contextId = activeAgentContextId;
        let session = getActiveSession();
        const now = new Date().toISOString();
        if (!session) {
          session = {
            id: createId("session"),
            title: titleFromMessage(message),
            createdAt: now,
            updatedAt: now,
            messages: []
          };
          state.agent.sessions.push(session);
          state.agent.activeSessionId = session.id;
        }
        session.messages.push({ role: "user", text: message, time: now });
        session.updatedAt = now;
        input.value = "";
        saveState(true);
        renderConversation();
        renderSessionList();
        const sessionId = session.id;
        setTimeout(() => {
          const target = state.agent.sessions.find((item) => item.id === sessionId);
          if (!target) return;
          const replyTime = new Date().toISOString();
          target.messages.push({
            role: "assistant",
            text: contextId ? "已结合当前业务上下文记录你的补充问题。这个本地原型会保留会话；接入真实 Agent 服务后，可继续返回关联客户、商机与任务结果。" : "这是本地原型回复：消息已保存到当前会话。接入真实 Agent 服务后，可在这里返回业务结果。",
            time: replyTime
          });
          target.updatedAt = replyTime;
          saveState();
          renderSessionList();
          if (state.agent.activeSessionId === sessionId) renderConversation();
        }, 420);
      }

      function applyAgentState() {
        document.querySelectorAll(".model-option").forEach((option) => option.classList.toggle("active", option.dataset.model === state.agent.model));
        modelSelector.querySelector(".model-label").textContent = state.agent.model;
        panel.classList.toggle("floating", state.agent.floating);
        popoutAgent.setAttribute("aria-pressed", String(state.agent.floating));
        popoutAgent.title = state.agent.floating ? "贴靠侧边" : "小窗展示";
        setAgent(state.agent.panelOpen, false, false);
        renderSessionList();
        renderConversation();
      }

      function openDataPopover() {
        const rect = dataMenuButton.getBoundingClientRect();
        dataPopover.style.top = Math.round(rect.bottom + 6) + "px";
        dataPopover.style.left = Math.round(Math.min(window.innerWidth - 188, Math.max(8, rect.right - 180))) + "px";
        dataPopover.hidden = false;
        dataMenuButton.setAttribute("aria-expanded", "true");
      }

      function closeDataPopover() {
        dataPopover.hidden = true;
        dataMenuButton.setAttribute("aria-expanded", "false");
      }

      function downloadBlob(content, type, filename) {
        const blob = new Blob([content], { type });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);
      }

      function exportPrototypeData() {
        const payload = {
          schema: EXPORT_SCHEMA,
          version: STATE_VERSION,
          exportedAt: new Date().toISOString(),
          data: state
        };
        const date = new Date().toISOString().slice(0, 10);
        downloadBlob(JSON.stringify(payload, null, 2), "application/json;charset=utf-8", "fxiaoke-crm-data-" + date + ".json");
        closeDataPopover();
        showToast("原型数据已导出");
      }

      async function importPrototypeData(file) {
        try {
          const parsed = JSON.parse(await file.text());
          if (!parsed || parsed.schema !== EXPORT_SCHEMA || Number(parsed.version) !== STATE_VERSION || !parsed.data) throw new Error("invalid");
          state = sanitizeState(parsed.data);
          saveState(true);
          renderCustomMenus();
          applyAgentState();
          closeDataPopover();
          showToast("原型数据已导入");
        } catch (error) {
          console.warn("原型数据导入失败", error);
          showToast("导入失败：请选择本原型导出的 JSON 文件");
        } finally {
          importDataFile.value = "";
        }
      }

      async function downloadCurrentHtml() {
        closeDataPopover();
        try {
          let html;
          if (location.protocol === "http:" || location.protocol === "https:") {
            const response = await fetch(location.href, { cache: "no-store" });
            if (!response.ok) throw new Error("download");
            html = await response.text();
          } else {
            html = "<!doctype html>\n" + document.documentElement.outerHTML;
          }
          downloadBlob(html, "text/html;charset=utf-8", "fxiaoke-crm-shell.html");
          showToast("单文件 HTML 已下载");
        } catch (error) {
          console.warn("HTML 下载失败", error);
          showToast("HTML 下载失败，请重试");
        }
      }

      openAgent.addEventListener("click", () => setAgent(!appRoot.classList.contains("agent-open")));
      railAgent.addEventListener("click", () => setAgent(true));
      closeAgent.addEventListener("click", () => setAgent(false, true));
      agentMenu.addEventListener("click", () => sessionDrawer.classList.contains("open") ? closeSessionDrawer() : openSessionDrawer());
      closeSessions.addEventListener("click", closeSessionDrawer);
      newConversation.addEventListener("click", startNewConversation);
      continueChat.addEventListener("click", resumeLatestConversation);
      popoutAgent.addEventListener("click", () => {
        state.agent.floating = !state.agent.floating;
        panel.classList.toggle("floating", state.agent.floating);
        popoutAgent.setAttribute("aria-pressed", String(state.agent.floating));
        popoutAgent.title = state.agent.floating ? "贴靠侧边" : "小窗展示";
        saveState();
      });

      sessionList.addEventListener("click", (event) => {
        const remove = event.target.closest("[data-delete-session]");
        if (remove) {
          const session = state.agent.sessions.find((item) => item.id === remove.dataset.deleteSession);
          if (!session || !confirm("确定删除会话“" + session.title + "”吗？")) return;
          state.agent.sessions = state.agent.sessions.filter((item) => item.id !== session.id);
          if (state.agent.activeSessionId === session.id) state.agent.activeSessionId = null;
          saveState();
          renderSessionList();
          renderConversation();
          showToast("会话已删除");
          return;
        }
        const choose = event.target.closest("[data-session-id]");
        if (choose) activateSession(choose.dataset.sessionId);
      });

      document.querySelectorAll(".agent-quick").forEach((button) => {
        button.addEventListener("click", () => sendAgentMessage(button.dataset.prompt));
      });

      input.addEventListener("input", () => {
        sendMessage.disabled = !input.value.trim();
      });
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
          event.preventDefault();
          composer.requestSubmit();
        }
      });
      composer.addEventListener("submit", (event) => {
        event.preventDefault();
        sendAgentMessage(input.value);
      });
      agentAttachment.addEventListener("click", () => showToast("附件能力可在接入 Agent 服务后启用"));
      agentVoice.addEventListener("click", () => showToast("语音能力可在接入 Agent 服务后启用"));

      modelSelector.addEventListener("click", (event) => {
        event.stopPropagation();
        modelMenu.hidden = !modelMenu.hidden;
        modelSelector.setAttribute("aria-expanded", String(!modelMenu.hidden));
      });
      modelMenu.addEventListener("click", (event) => {
        const option = event.target.closest("[data-model]");
        if (!option) return;
        state.agent.model = option.dataset.model;
        document.querySelectorAll(".model-option").forEach((item) => item.classList.toggle("active", item === option));
        modelSelector.querySelector(".model-label").textContent = state.agent.model;
        modelMenu.hidden = true;
        modelSelector.setAttribute("aria-expanded", "false");
        saveState();
        showToast("已切换至" + state.agent.model);
      });

      workspaceCard.addEventListener("click", (event) => {
        if (event.target.closest(".ict-workbench")) {
          handleICTWorkbenchClick(event);
          return;
        }
        const refresh = event.target.closest("[data-workbench-refresh]");
        if (refresh) {
          const root = workspaceCard.querySelector(".workbench-root");
          if (root) root.classList.add("wb-loading");
          refresh.disabled = true;
          setTimeout(() => {
            if (root && root.isConnected) root.classList.remove("wb-loading");
            if (refresh.isConnected) refresh.disabled = false;
            showToast("工作台数据已刷新");
          }, 360);
          return;
        }
        const actionTrigger = event.target.closest("[data-workbench-action]");
        if (actionTrigger) {
          openWorkbenchAction(actionTrigger.dataset.workbenchAction);
          return;
        }
        const trigger = event.target.closest("[data-route], [data-context-id]");
        if (!trigger) return;
        const route = trigger.dataset.route;
        const contextId = trigger.dataset.contextId;
        const contextSource = contextId ? getAgentContextSourceLabel(trigger) : "";
        if (route) navigateWorkbench(route);
        if (contextId) showAgentContext(contextId, contextSource);
      });
      workspaceCard.addEventListener("change", handleICTWorkbenchChange);
      workspaceCard.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const objectOwner = event.target.closest(".object-row, .work-item");
        if (!objectOwner || event.target !== objectOwner || !objectOwner._ictObject) return;
        event.preventDefault();
        openICTDetail(objectOwner._ictObject);
      });

      agentWorkbenchContext.addEventListener("click", (event) => {
        const processToggle = event.target.closest("[data-context-process-toggle]");
        if (processToggle) {
          const detail = agentWorkbenchContext.querySelector("[data-context-process-detail]");
          const expanded = processToggle.getAttribute("aria-expanded") === "true";
          processToggle.setAttribute("aria-expanded", String(!expanded));
          if (detail) detail.hidden = expanded;
          return;
        }
        const feedbackTrigger = event.target.closest("[data-context-feedback]");
        if (feedbackTrigger) {
          const feedback = feedbackTrigger.dataset.contextFeedback;
          if (feedback === "regenerate") {
            const currentContext = WORKBENCH_CONTEXTS[activeAgentContextId];
            if (currentContext) agentWorkbenchContext.innerHTML = renderAgentContext(currentContext, activeAgentContextSource);
            showToast("已重新整理当前分析");
          } else if (feedback === "copy") {
            const answer = agentWorkbenchContext.querySelector(".agent-context-answer");
            const copyText = answer ? Array.from(answer.querySelectorAll(".agent-context-answer-title, .agent-context-source-name, .agent-context-answer > p, .agent-context-section")).map((element) => element.innerText.trim()).filter(Boolean).join("\n\n") : "";
            if (copyText && navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(copyText).then(() => showToast("回答已复制")).catch(() => showToast("复制失败：请手动选择文本"));
            } else {
              showToast("复制失败：请手动选择文本");
            }
          } else if (feedback === "helpful" || feedback === "not-helpful") {
            agentWorkbenchContext.querySelectorAll('[data-context-feedback="helpful"], [data-context-feedback="not-helpful"]').forEach((button) => button.setAttribute("aria-pressed", String(button === feedbackTrigger)));
            showToast(feedback === "helpful" ? "已记录：这个回答有帮助" : "已记录：这个回答需要改进");
          } else {
            showToast("可在下方输入框继续补充要求");
          }
          return;
        }
        const routeTrigger = event.target.closest("[data-context-route]");
        if (routeTrigger) {
          navigateWorkbench(routeTrigger.dataset.contextRoute);
          return;
        }
        const actionTrigger = event.target.closest("[data-context-action]");
        if (actionTrigger) openWorkbenchAction(actionTrigger.dataset.contextAction);
      });

      closeWorkbenchActionButton.addEventListener("click", () => closeWorkbenchAction());
      cancelWorkbenchAction.addEventListener("click", () => closeWorkbenchAction());
      workbenchActionDialog.addEventListener("click", (event) => {
        if (event.target === workbenchActionDialog) closeWorkbenchAction();
      });
      confirmWorkbenchAction.addEventListener("click", () => {
        const actionId = pendingWorkbenchAction;
        const action = WORKBENCH_ACTIONS[actionId];
        closeWorkbenchAction(false);
        if (!action) return;
        showToast(actionId === "claim-tender" ? "标讯已加入待确认清单" : actionId === "upload-minutes" ? "已打开纪要选择入口" : action.title + "草稿已生成");
      });

      crmMenuList.addEventListener("click", (event) => {
        const item = event.target.closest(".crm-menu-item");
        if (item) selectMenu(item.dataset.menu);
      });
      crmSearch.addEventListener("input", applyMenuSearch);
      addMenu.addEventListener("click", openMenuConfig);
      closeMenuDialogButton.addEventListener("click", () => closeMenuConfig());
      cancelMenuDialog.addEventListener("click", () => closeMenuConfig());
      menuDialog.addEventListener("click", (event) => {
        if (event.target === menuDialog) closeMenuConfig();
      });
      menuConfigForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const name = safeString(menuName.value, 20);
        const iconInput = menuConfigForm.querySelector('input[name="menuIcon"]:checked');
        if (!name) {
          menuName.focus();
          showToast("请输入菜单名称");
          return;
        }
        if (getMenuButtons().some((button) => button.dataset.menu === name)) {
          menuName.focus();
          showToast("菜单名称已存在");
          return;
        }
        const menu = { id: createId("menu"), name, icon: iconInput ? iconInput.value : "home" };
        state.customMenus.push(menu);
        state.activeMenu = menu.name;
        saveState(true);
        renderCustomMenus();
        closeMenuConfig();
        showToast("菜单已添加");
      });
      customMenuList.addEventListener("click", (event) => {
        const remove = event.target.closest("[data-delete-menu]");
        if (!remove) return;
        const menu = state.customMenus.find((item) => item.id === remove.dataset.deleteMenu);
        if (!menu || !confirm("确定删除菜单“" + menu.name + "”吗？")) return;
        state.customMenus = state.customMenus.filter((item) => item.id !== menu.id);
        if (state.activeMenu === menu.name) state.activeMenu = "首页";
        saveState();
        renderCustomMenus();
        showToast("菜单已删除");
      });

      dataMenuButton.addEventListener("click", (event) => {
        event.stopPropagation();
        dataPopover.hidden ? openDataPopover() : closeDataPopover();
      });
      exportDataButton.addEventListener("click", exportPrototypeData);
      importDataButton.addEventListener("click", () => importDataFile.click());
      importDataFile.addEventListener("change", () => {
        const file = importDataFile.files && importDataFile.files[0];
        if (file) importPrototypeData(file);
      });
      downloadHtmlButton.addEventListener("click", downloadCurrentHtml);

      document.querySelectorAll(".global-nav-item:not(#railAgent)").forEach((item) => {
        item.addEventListener("click", () => {
          if (item.dataset.nav !== "CRM") showToast(item.dataset.nav + "入口为壳层演示");
        });
      });

      document.addEventListener("click", (event) => {
        if (!modelMenu.hidden && !modelMenu.contains(event.target) && !modelSelector.contains(event.target)) {
          modelMenu.hidden = true;
          modelSelector.setAttribute("aria-expanded", "false");
        }
        if (!dataPopover.hidden && !dataPopover.contains(event.target) && !dataMenuButton.contains(event.target)) closeDataPopover();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        if (!workbenchActionDialog.hidden) closeWorkbenchAction();
        else if (!menuDialog.hidden) closeMenuConfig();
        else if (!dataPopover.hidden) closeDataPopover();
        else if (!modelMenu.hidden) {
          modelMenu.hidden = true;
          modelSelector.setAttribute("aria-expanded", "false");
          modelSelector.focus();
        } else if (sessionDrawer.classList.contains("open")) closeSessionDrawer();
        else if (appRoot.classList.contains("agent-open")) setAgent(false, true);
      });
      window.addEventListener("resize", closeDataPopover);

      renderCustomMenus();
      applyAgentState();
      saveState();
    })();
  </script>


</body></html>
